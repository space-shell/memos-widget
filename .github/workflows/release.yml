name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test assembleDebug assembleRelease

      - name: Collect artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "memos-widget-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "memos-widget-${GITHUB_REF_NAME}-release.apk"
          sha256sum memos-widget-*.apk > checksums.txt

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" memos-widget-*.apk checksums.txt --clobber && break
            else
              gh release create "$GITHUB_REF_NAME" --generate-notes \
                memos-widget-*.apk checksums.txt && break
            fi
            echo "upload attempt $attempt failed; retrying in 30s"
            sleep 30
          done
