AutoName: Memos Widget
Name: Memos Widget
Summary: Quick-capture widget for your self-hosted Memos server
Description: |-
  An Android client for Memos focused on fast capture against your own
  self-hosted instance.

  * Home screen widget: latest memos with relative timestamps, a rotating
    composition prompt, and a single compose button; the title opens the
    server in the browser.
  * Quick compose overlay with the keyboard ready; default visibility
    (PRIVATE / PROTECTED / PUBLIC) configurable.
  * Share target for text and URLs.
  * Configure server address and personal access token; no tracking or
    analytics.

  Note: Android home screen widgets cannot host real text input, so the
  widget launches a lightweight compose overlay as the typing surface.

  Text memos only for now; image/video attachments are planned.

